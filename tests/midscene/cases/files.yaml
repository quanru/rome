cases:
  - name: FILE-01 Projects tree shows the fixture folders and files
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects
      - wait:
          duration: 1000
      - aiAct: >-
          Use the project-file search to find todo.md, then clear the search so the complete
          top-level project tree is visible again.
      - aiAssert: >-
          The Projects file browser is shown in English with the heading "Projects", a "Search
          project files..." search field, and a New (+) control. The top level of the folder tree
          lists the "demo-app" and "research" folders (collapsed) plus a "todo.md" file.
      - aiAssert: >-
          With a folder selected, the right-hand dashboard area fails to load its summary because
          that endpoint is not mocked: a "Network error" message with a "Retry" button is shown,
          while the file tree itself remains usable.
  - name: FILE-02 Opening a file renders its contents in the viewer
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects
      - wait:
          duration: 800
      - aiAct: Expand the "demo-app" folder and open its "README.md" file in the tree.
      - wait:
          duration: 1200
      - aiAssert: >-
          The README.md file opens in the content area in Preview mode, rendering its markdown (a
          "README.md" heading and the mock file body), and the expanded demo-app folder lists its
          "src" subfolder, "README.md", and "notes.txt".
  - name: FILE-03 Editing a text file persists within the session
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects/todo.md
      - wait:
          duration: 1200
      - aiAct: Find and click the "Edit" option of the Preview/Edit view toggle.
      - wait:
          duration: 1000
      - aiAct: |-
          Use the visible code editor to append "
          Buy more coffee beans", then save the file.
      - aiAssert: A control labelled "Save" is visible, it is disabled.
      - aiAssert: The editor's text ends with the newly appended line "Buy more coffee beans".
      - aiAct: >-
          Expand the "research" folder in the tree and open its "papers.md" file, then open
          "todo.md" again.
      - wait:
          duration: 1200
      - aiAssert: >-
          The todo.md content shown now ends with the line "Buy more coffee beans" (the edit made
          before switching files is still present).
  - name: FILE-04 Creating a new file appears in the tree
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects
      - wait:
          duration: 1000
      - aiAct: Find and click the "demo-app" folder row in the file tree.
      - wait:
          duration: 500
      - aiAct: Find the visible control labelled "New" and click it.
      - wait:
          duration: 500
      - aiAct: Find and click New file.
      - wait:
          duration: 700
      - aiAssert: >-
          A "New file" dialog opens titled "New file", explaining it will create a file in
          projects/demo-app/, with a Name field prefilled "Untitled.md" and "Cancel" / "Create file"
          actions.
      - aiAct: Find the field identified by "Name", replace its current value with "CHECKLIST.md".
      - aiAct: Find and click Create file.
      - wait:
          duration: 1200
      - app.expectUrl:
          path: /projects/demo-app/CHECKLIST.md
      - wait:
          duration: 800
      - aiAssert: >-
          The new CHECKLIST.md opens automatically in the content area and also appears under
          demo-app in the tree (the mock's file-watch event reconciles it in immediately), selected
          as the active row.
      - aiAct: Find and click the "Edit" option of the Preview/Edit view toggle.
      - wait:
          duration: 1000
      - aiAct: |-
          Use the visible code editor to replace the editor contents with "# Checklist
          ", then save the file.
      - aiAssert: A control labelled "Save" is visible, it is disabled.
      - aiAssert: The editor's first line reads "# Checklist" for CHECKLIST.md.
  - name: FILE-05 Renaming onto an existing name shows the conflict error
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects
      - wait:
          duration: 1000
      - aiAct: Find and click the "demo-app" folder expander in the file tree.
      - wait:
          duration: 600
      - aiAct: Find the visible control labelled "More actions for notes.txt" and click it.
      - wait:
          duration: 500
      - aiAct: Find and click Rename.
      - wait:
          duration: 700
      - aiAssert: >-
          A "Rename item" dialog opens with the Name field prefilled "notes.txt" and "Cancel" /
          "Rename" actions.
      - aiAct: Find the field identified by "Name", replace its current value with "README.md".
      - aiAct: Find and click Rename.
      - wait:
          duration: 900
      - aiAssert: >-
          An error toast reads "Already exists." and both files remain in the tree: "notes.txt" is
          still listed and "README.md" is untouched.
  - name: FILE-06 Memory browser shows journal, relationship and project notes
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /memory
      - wait:
          duration: 1000
      - aiAssert: >-
          The Memory file browser is shown with top-level folders "journal", "projects",
          "relationship", and "topics", plus "IDENTITY.md" and "MEMORY.md" notes.
      - aiAct: Find and click the "relationship" folder expander in the file tree.
      - wait:
          duration: 700
      - aiAssert: >-
          Expanding "relationship" reveals "BONDS.md", "GUARDIAN.md", and per-person notes including
          "ray-oster.md", "nadia-petrova.md", and "mira-chen.md".
      - aiAct: Find and click the "BONDS.md" tree row.
      - wait:
          duration: 1000
      - aiAssert: >-
          The file renders in Preview mode with the heading "Relationship Bonds" and an "Inner
          Circle" section listing ray-oster and nadia-petrova.
  - name: FILE-07 Today's journal entry exists under the dated journal path
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /memory
      - wait:
          duration: 800
      - aiAct: >-
          Expand the "journal" folder and its year/month subfolders, then open today's journal entry
          (the single .md file under the month folder).
      - wait:
          duration: 1000
      - aiAssert: >-
          Today's journal note opens with a date heading and lists the items about Ray's Saturday
          hike and Mira's clinic intake form.
  - name: FILE-08 Memory notes can be edited and survive switching files
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /memory
      - wait:
          duration: 800
      - aiAct: Expand "projects" and its "default" subfolder, then open "PROJECT.md".
      - wait:
          duration: 1000
      - aiAct: Find and click the "Edit" option of the Preview/Edit view toggle.
      - wait:
          duration: 1000
      - aiAct: |-
          Use the visible code editor to append "
          ## Update

          Follow up Friday.
          ", then save the file.
      - aiAssert: A control labelled "Save" is visible, it is disabled.
      - aiAct: >-
          Open "GUARDIAN.md" inside the relationship folder, then open PROJECT.md under
          projects/default again.
      - wait:
          duration: 1200
      - aiAssert: The reopened PROJECT.md still contains "Follow up Friday." under its "Update" heading.
