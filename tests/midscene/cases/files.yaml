cases:
  - name: FILE-01 Search the project tree
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects
      - aiAct: >-
          Enter "todo.md" in the visible "Search project files..." field, then stop.
      - aiAssert: >-
          The project search field contains "todo.md" and the matching todo.md file is visible in
          the project tree.
  - name: FILE-02 Open an existing project file for editing
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects/todo.md
      - aiAct: >-
          Click "Edit" in the Preview/Edit view toggle once, then stop.
      - aiAssert: >-
          todo.md is open in Edit mode with a visible text editor and Save control.
  - name: FILE-03 Handle a duplicate project-file rename
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /projects
      - aiAct: >-
          1. Find and click the "demo-app" folder expander in the file tree.

          2. Find the visible control labelled "More actions for notes.txt" and click it.

          3. Find and click Rename.

          4. Find the field identified by "Name", replace its current value with "README.md".

          5. Find and click Rename.

          6. Before continuing, confirm these visible checkpoints: A "Rename item" dialog opens with
          the Name field prefilled "notes.txt" and "Cancel" / "Rename" actions.
      - aiAssert: >-
          The duplicate rename is rejected: both "notes.txt" and the existing "README.md" remain
          listed in the demo-app tree.
  - name: FILE-04 Open relationship bonds from Memory
    tags:
      - files
      - shard-4
    steps:
      - app.open:
          path: /memory
      - aiAct: >-
          Expand the "relationship" folder and open its "BONDS.md" file. Stop with the note open.
      - aiAssert: >-
          The file renders in Preview mode with the heading "Relationship Bonds" and an "Inner
          Circle" section listing ray-oster and nadia-petrova.
