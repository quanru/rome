cases:
  - name: CHAT-06 Collapse the architecture diagram in a built-app reply
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - aiAct: >-
          In the visible "Architecture" section, click the expanded "Mermaid diagram" disclosure
          to collapse it. Finish with the disclosure closed.
      - aiAssert: >-
          The "Architecture" section and "Mermaid diagram" disclosure remain visible, but the
          diagram content is collapsed. The nearby "Verification" heading is still visible.
  - name: CHAT-07 Open a linked learning kit from a recorded conversation
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-learn-video
      - aiAct: >-
          Click the visible blue underlined "Open the learning kit" text once, then stop.
      - aiAssert: >-
          The YouTube Distill recorded app opens in a workspace tile beside the conversation (the
          chat URL is unchanged), showing content for the video "Deep Dive into LLMs like ChatGPT"
          rather than an error.
  - name: CHAT-08 Complete the live question card and preserve its failed submission
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-2
      - aiAct: >-
          On the visible question card, choose "Warm" and select "The beta thank-you" under "What
          should the new opening keep?". Submit with the Send button inside that card, not the
          conversation composer. Finish after the failed-request error appears.
      - aiAssert: >-
          Submission fails with an error above the composer reporting the failed request to the
          ".../turns" endpoint (there is no model backend in mock mode); the conversation stays on
          screen with the card and its selections intact.
  - name: CHAT-09 Reject the plumber approval card
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-4
      - aiAct: >-
          Click "Reject" on the visible "Guardian approval needed" card and finish when the card
          shows its rejected state.
      - aiAssert: >-
          The approval card visibly shows that the request was rejected.
