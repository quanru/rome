cases:
  - name: CHAT-15 Answered design question card is locked with chosen answers
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - wait:
          duration: 1200
      - aiAct: >-
          Find the answered design-question card and try to change one selected answer. Confirm the
          card does not accept changes and do not interact with any other card.
      - aiAssert: >-
          the visible interface contains "When should the app label an issue?", "Should it apply
          labels directly, or suggest for review?", "How should the label set be built?", "Which
          label dimensions should the classifier assign?", "Which GitHub repo(s) do you want to wire
          up first", "Answered"; it does not contain "Asked by Rome".
      - aiAssert: >-
          The answered card remains locked. Its ten chosen answers stay selected, and no Send or
          editable action row is available below the card.
  - name: CHAT-16 Built-app reply renders sections and a collapsible mermaid diagram
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - aiAssert: >-
          the visible interface contains "built, installed, and verified", "What it does",
          "Architecture", "Verification".
      - aiAct: Explore the page by scrolling until the content containing "What it does" is visible.
      - wait:
          duration: 500
      - aiAssert: >-
          The final assistant message states the Issue Triage app is "built, installed, and
          verified" and the "What it does" section heading is rendered as a second-level heading.
      - aiAct: Explore the page by scrolling until the content containing "Mermaid diagram" is visible.
      - wait:
          duration: 700
      - aiAssert: Inside the "Architecture" section there is a collapsible "Mermaid diagram" card.
  - name: CHAT-17 Learning kit links open YouTube Distill in a workspace tile
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-learn-video
      - aiAct: >-
          Explore the page by scrolling until the content containing "Your learning kit is ready" is
          visible.
      - wait:
          duration: 700
      - aiAssert: >-
          The assistant message says "Your learning kit is ready in YouTube Distill." followed by a
          Format/Use it for table whose rows include "Mind map", "Summary", "11-slide deck", and
          "Transcript excerpt", and a link "Open the learning kit".
      - aiAct: Find the content link labelled "Open the learning kit" and open it.
      - wait:
          duration: 3000
      - aiAssert: >-
          The YouTube Distill recorded app opens in a workspace tile beside the conversation (the
          chat URL is unchanged), showing content for the video "Deep Dive into LLMs like ChatGPT"
          rather than an error.
  - name: CHAT-18 Workout plan links open Fitness Tracker in a workspace tile
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-fitness-plan
      - aiAct: >-
          Explore the page by scrolling until the content containing "I've put together a week" is
          visible.
      - wait:
          duration: 700
      - aiAssert: >-
          The assistant message says "I've put together a week in Fitness Tracker." and shows the
          weekly plan table with "Full body" / "20 min" on Monday and "Rest" on Sunday, plus the
          link "Open your workout plan".
      - aiAct: Find the content link labelled "Open your workout plan" and open it.
      - wait:
          duration: 3000
      - aiAssert: >-
          Fitness Tracker opens in a workspace tile beside the conversation, showing the weekly
          workout plan, not an error screen.
  - name: CHAT-19 Market recap links open a specific Stock Daily report tile
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-market-brief
      - aiAct: >-
          Explore the page by scrolling until the content containing "Your weekday recap is set up"
          is visible.
      - wait:
          duration: 700
      - aiAssert: >-
          The assistant message says "Your weekday recap is set up in Stock Daily." and shows a
          Setting/Schedule table whose rows include Runs "Monday–Friday at 1:30 PM", Time zone
          "America/Los_Angeles", and Delivery "guardian@example.com". Below it are links to the
          "September 11 market recap" and "September 10 market recap" reports.
      - aiAct: Find the content link labelled "September 11 market recap" and open it.
      - wait:
          duration: 3000
      - aiAssert: >-
          Stock Daily opens in a workspace tile on the September 11 report, whose title includes "US
          Stock Market Daily Close Report | 2026-09-11", while the conversation stays open beside
          it.
  - name: CHAT-20 Live question card enables Send only after required answers
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-2
      - aiAct: Scroll the main content area to the bottom.
      - wait:
          duration: 800
      - aiAssert: >-
          A live question card titled around "How should the rewrite read?" shows single-choice tone
          options "Warm", "Plain", and "Playful", multi-choice options under "What should the new
          opening keep?", and an optional "Anything to avoid?" field, with an "Asked by Rome"
          footer.
      - aiAssert: A control labelled "Send" is visible, it is disabled.
      - aiAct: Find and click Warm.
      - wait:
          duration: 400
      - aiAct: Select one of the multi-choice options under "What should the new opening keep?".
      - wait:
          duration: 400
      - aiAssert: A control labelled "Send" is visible, it is enabled.
      - aiAct: >-
          Submit the live question card with its own Send button. Do not use the conversation
          composer below it.
      - wait:
          duration: 1500
      - aiAssert: >-
          Submission fails with an error above the composer reporting the failed request to the
          ".../turns" endpoint (there is no model backend in mock mode); the conversation stays on
          screen with the card and its selections intact.
  - name: CHAT-21 Rejecting the plumber approval resolves the card as rejected
    tags:
      - chat
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-4
      - aiAssert: >-
          The "Guardian approval needed" card shows "Pending approval" with the telegram message
          preview and "Reject" / "Approve" buttons.
      - aiAct: Find and click Reject.
      - wait:
          duration: 1200
      - aiAssert: >-
          The card resolves to a rejected state: the badge reads "Rejected" and the footer says
          "Action rejected by guardian." Neither "Reject" nor "Approve" buttons remain.
