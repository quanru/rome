cases:
  - name: E2E-03 Open a built app from Chat
    tags:
      - poc
      - story
      - apps
      - shard-2
      - deterministic-assist
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - app.scrollTextIntoView:
          text: Done. The Issue Triage app is built, installed, and verified
      - app.clickByLabel:
          label: Issue Triage
          exact: true
          index: 1
      - aiAct: >-
          In the Issue Triage workspace tile beside the conversation, click Refresh once and wait
          for the dashboard totals and repository list to load again.
      - aiAssert: >-
          The Issue Triage app is open in a workspace tile beside the still-visible conversation.
          Its dashboard shows repository or triage content, not an error or page-not-found state.
