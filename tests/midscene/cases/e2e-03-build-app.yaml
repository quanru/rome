cases:
  - name: E2E-03 Open a built app from Chat
    tags:
      - poc
      - story
      - apps
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - aiAct: >-
          Click the visible "Issue Triage" app link in the final built-app reply once, then stop.
      - aiAssert: >-
          The Issue Triage app dashboard is open and shows repository or triage content rather than
          an error or page-not-found state.
