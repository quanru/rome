cases:
  - name: E2E-03 Open the built Issue Triage app from its chat link and find it in Apps
    tags:
      - poc
      - story
      - apps
      - shard-2
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - aiAct: >-
          Explore the page by scrolling until the content containing "When should the app label an
          issue?" is visible.
      - aiAssert: >-
          The conversation "Build an app from an idea" is open. The design question card is visible
          with its questions, including "When should the app label an issue?" and "Should it apply
          labels directly, or suggest for review?".
      - aiAct: Find the content link labelled "Issue Triage" and open it.
      - wait:
          duration: 3000
      - aiAssert: >-
          The Issue Triage app opens in a workspace tile beside the still-open conversation. Its
          dashboard is visible inside that tile (repository configuration / triage content), not an
          error or "page not found".
      - aiAct: Find and click the Apps entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /apps
      - aiAssert: >-
          The Apps page's installed apps list shows "Issue Triage" as an installed app with an
          affordance to open it.
