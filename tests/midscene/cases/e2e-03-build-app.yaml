cases:
  - name: E2E-03 Open a built app from Chat
    tags:
      - poc
      - story
      - apps
      - shard-2
      - deterministic-assist
    steps:
      - app.open:
          path: /chat/mock-chat-build-app
      - app.scrollTextIntoView:
          text: Done. The Issue Triage app is built, installed, and verified
      - aiAct: >-
          Inside the chat conversation, find the visible sentence beginning "Done. The Issue Triage
          app is built". Click near the upper-middle of the visible blue letter strokes in its final
          underlined "Issue Triage" link, avoiding the underline and lower edge. Click once, then stop
          immediately. Regardless of whether the screen visibly changes, declare the action complete
          after that one click and never retry it. Do not click the separate Issue Triage entry in the
          left sidebar.
      - aiAssert: >-
          The Issue Triage app is open in a workspace tile beside the still-visible conversation.
          Its dashboard shows repository or triage content, not an error or page-not-found state.
