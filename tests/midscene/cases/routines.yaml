cases:
  - name: ROUT-01 Explore routine list, calendar, timeline, and creation options
    tags:
      - routines
      - shard-3
    steps:
      - app.open:
          path: /routines
      - aiAct: >-
          1. Open the Calendar view, then return to List and inspect the routine groups and
          controls.
      - aiAssert: >-
          The Routines page is shown in English with a "Create Routine" button. Summary cards read
          "Total 6", "Active 5", and "Paused 1", and a "Next up" card names "Morning brief". View
          switcher buttons read "List", "Calendar", and "Timeline", with "List" active. The list is
          grouped into "On a schedule", "When something happens", and "On demand". The schedule
          group lists "Morning brief" (Every day at 7:00 AM), "Weekday inbox sweep" (Every weekday
          at 5:30 PM), "Rent reminder" (On the 28th of every month at 9:00 AM, Europe/Berlin), and
          "Weekly digest" (Every Sunday at 6:00 PM). Each schedule row has a toggle switch and a run
          control — "Run now", or "Stop" while the routine is currently executing. "Ledger sync"
          sits under "When something happens" with the text "Whenever a expense logged event happens
          (from expense-tracker)", and "Archive old notes" sits under "On demand" with the text
          "Only when you run it"; its toggle is switched off, which accounts for the single paused
          routine.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find and click Calendar.

          3. Find and click List.

          4. Before continuing, confirm these visible checkpoints: it contains text matching
          "\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+20\d\d\b".
          The view switches to a monthly calendar headed with the current month name and four-digit
          year, with weekday headers (Sun through Sat) and dated cells. A legend distinguishes
          "recurring" and "one-time" runs, and days carrying scheduled routines show markers.
          "Calendar" is the active view switcher button.
      - aiAssert: Switching back to "List" restores the grouped routine list with "Morning brief" visible.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find and click Timeline.
      - aiAssert: >-
          The timeline view shows a "NOW" marker followed by upcoming scheduled runs in
          chronological order: "Morning brief" with "Schedule · recurring" and the action
          "daily_summary", "Weekday inbox sweep" with "inbox_scan", and "Rent reminder" with
          "send_message". Each entry offers "Disable" and "Delete" actions. The "Weekly digest"
          entry shows "No next run".
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find and click Create Routine.

          3. Find and click Cancel.

          4. Before continuing, confirm these visible checkpoints: A "Create Routine" dialog opens
          with a "Trigger type" choice of three cards: "Schedule" ("Fires on a clock — once at a
          date or on a recurring rule."), "Event" ("Fires when a matching event is emitted on the
          internal bus."), and "Manual" ("Never fires on its own — you run it by hand from here.").
          With Schedule selected, the form has Name, "one-time"/"recurring" schedule options,
          Timezone, Date, Action Name ("Pick an action…"), and "Args (JSON object)" fields, plus
          "Cancel" and "Create Routine" buttons.
      - aiAssert: >-
          The dialog closes and no new routine is created: the totals still read "Total 6" and
          "Active 5".
  - name: ROUT-02 Toggle an on-demand routine and restore its paused state
    tags:
      - routines
      - shard-3
    steps:
      - app.open:
          path: /routines
      - aiAct: >-
          1. Switch on the toggle switch on the "Archive old notes" row under "On demand".

          2. Switch the "Archive old notes" toggle back off.

          3. Before continuing, confirm these visible checkpoints: The summary cards read "Active 5"
          and "Paused 1", and the "Archive old notes" row under "On demand" shows its toggle
          switched off. The toggle is now switched on and the summary updates to "Active 6" and
          "Paused 0".
      - aiAssert: The summary returns to "Active 5" and "Paused 1".
