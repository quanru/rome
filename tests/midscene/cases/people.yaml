cases:
  - name: PPL-01 Browse recent people, directory groups, and bond filters
    tags:
      - people
      - shard-4
    steps:
      - app.open:
          path: /people
      - aiAct: >-
          1. Open the Directory tab, then return to Latest and inspect the recent-conversation
          previews.
      - aiAssert: >-
          The People page opens in English on the "Latest" tab (with a "Directory" tab alongside).
          The latest feed lists "Ray Oster" with the preview "perfect, see you then", "Arvind
          Srivastav" with "Likewise! Free Thursday afternoon?", and "Mira Chen" with "thanks for
          sending that over", each with a relative timestamp.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find and click Directory.
      - aiAssert: >-
          The Directory view shows bond filter chips including "All", "Inner circle",
          "Acquaintance", "Other", and "Stranger", with "All" active, plus a separate "Unknown 11"
          count control. People are grouped under headings "INNER CIRCLE 2" ("Nadia Petrova", "Ray
          Oster"), "ACQUAINTANCE 2" ("Arvind Srivastav", "Mira Chen"), and "OTHER 2" ("Hollis Park",
          "Sam Okafor"), each row showing an avatar; rows that have linked accounts additionally
          show an account handle or phone number.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Select the "Inner circle" bond filter and inspect its two people.

          3. Then select the "Acquaintance" bond filter and finish with that filtered list visible.
      - aiAssert: Switching to "Acquaintance" shows only "Arvind Srivastav" and "Mira Chen".
  - name: PPL-02 Inspect a person timeline, channel filters, and account actions
    tags:
      - people
      - shard-4
    steps:
      - app.open:
          path: /people/person/ray-oster
      - aiAct: 1. Switch the timeline to WhatsApp, inspect the messages, then restore the All filter.
      - aiAssert: >-
          The person detail page for "Ray Oster" shows the "Inner circle" bond, an "8 messages"
          count, the phone number "+1 (415) 555-0142", and a "TIMELINE" filter row with "All",
          "Telegram", and "WhatsApp" options, with "All" selected. Messages are grouped under day
          headings such as "TODAY" and "YESTERDAY", each labeled with its "WhatsApp" channel and
          time; today's thread includes "still ok for thursday at 6?". At the bottom a composer
          addresses "WhatsApp · +1 (415) 555-0142" with a "Send" button.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find the visible control labelled "WhatsApp" and click it.

          3. Find the visible control labelled "All" and click it.

          4. Before continuing, confirm these visible checkpoints: A radio labelled "WhatsApp" is
          visible, it is selected. A radio labelled "Telegram" is visible, it is not selected. The
          timeline keeps showing its message rows, and the thread composer at the bottom now
          addresses "WhatsApp · +1 (415) 555-0142", confirming the view is scoped to the WhatsApp
          thread.
      - aiAssert: >-
          A radio labelled "All" is visible, it is selected. A radio labelled "WhatsApp" is visible,
          it is not selected. The unfiltered timeline shows source-channel badges on its message
          rows.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find the visible control labelled "Actions for Ray Oster" and click it.
      - aiAssert: >-
          The management menu is open with "Change bond", "Link account…", "Merge into another
          person…", and "Memory profile" actions.
      - aiAct: Close the management menu without choosing an action.
      - app.expectUrl:
          path: /people/person/ray-oster
      - aiAssert: >-
          The management menu is closed; the Ray Oster person profile is still displayed with its
          header (name and bond badge) and timeline.
