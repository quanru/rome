cases:
  - name: APPS-01 Installed apps grid lists the five fixture apps and built-in entries
    tags: [apps, shard-2]
    steps:
      - app.open: { path: /apps }
      - aiAssert: >-
          The Apps page is shown in English with the heading "Apps". There is
          a search field labeled "Search apps", an "App store" button, and an
          "Update all" button.
      - aiAssert: >-
          The "My apps" screen shows an "Installed apps" group and a
          "Built-in apps" group, each with a count badge (5 and 9). The
          fixture app tiles and the built-in entry tiles are laid out in a
          grid.
      # Narrow tiles truncate long names visually (e.g. "Fitness Trac…"), so
      # verify the full names and the built-in roster in the DOM instead of
      # asking the model to read a clipped screenshot.
      - app.expectTexts:
          all:
            - "Installed apps"
            - "YouTube Distill"
            - "Code Review"
            - "Issue Triage"
            - "Fitness Tracker"
            - "Stock Daily"
            - "Built-in apps"
            - "Browser"

  - name: APPS-02 Search narrows the apps grid
    tags: [apps, shard-2]
    steps:
      - app.open: { path: /apps }
      - app.typeText: { target: "Search apps", text: "issue" }
      - wait: { duration: 700 }
      - aiAssert: >-
          The grid shows "1 result" and only the "Issue Triage" app is
          listed; the other installed apps ("Code Review", "Stock Daily",
          etc.) are not shown.

  - name: APPS-03 Search without matches shows the empty state
    tags: [apps, shard-2]
    steps:
      - app.open: { path: /apps }
      - app.typeText: { target: "Search apps", text: "zzz-nonexistent" }
      - wait: { duration: 700 }
      - aiAssert: >-
          The page shows the empty state 'No apps match "zzz-nonexistent"'
          and the helper text "Try a different search, or browse the App
          store."

  - name: APPS-04 Disable an app from its tile menu and re-enable it
    tags: [apps, shard-2]
    steps:
      - app.open: { path: /apps }
      - app.clickByLabel: { label: "More actions for Issue Triage" }
      - wait: { duration: 500 }
      - aiAssert: >-
          An app tile actions dropdown menu is open listing the entries
          "View details", "Open full view", "Pin to sidebar", "Access",
          "Disable", "Uninstall", and "Uninstall and erase data". There is
          no "Enable" entry because the app is currently enabled.
      - aiTap: 'the "Disable" menu item for Issue Triage'
      - wait: { duration: 1000 }
      # Disabling applies immediately (no confirmation dialog). The tile keeps
      # its layout; the observable state change is in the tile's own menu.
      - app.clickByLabel: { label: "More actions for Issue Triage" }
      - wait: { duration: 500 }
      - aiAssert: >-
          The reopened tile menu now offers "Enable" and no longer offers
          "Disable".
      - aiTap: 'the "Enable" menu item'
      - wait: { duration: 1000 }
      - app.clickByLabel: { label: "More actions for Issue Triage" }
      - wait: { duration: 500 }
      - aiAssert: >-
          The menu is back to the enabled state: it offers "Disable" and
          does not offer "Enable".
      - app.pressKey: { key: Escape }

  - name: APPS-05 Uninstall an app through the confirmation dialog
    tags: [apps, shard-2]
    steps:
      - app.open: { path: /apps }
      - app.clickByLabel: { label: "More actions for Stock Daily" }
      - wait: { duration: 500 }
      - aiTap: 'the "Uninstall" menu item (the plain one, not "Uninstall and erase data")'
      - wait: { duration: 800 }
      - aiAssert: >-
          A confirmation dialog titled "Uninstall Stock Daily?" explains that
          the app is removed but its database rows and data directory are
          preserved for a later reinstall, and offers "Cancel" and
          "Uninstall" buttons.
      - aiTap: 'the "Uninstall" button in the confirmation dialog'
      - wait: { duration: 1200 }
      - aiAssert: >-
          The Stock Daily tile disappears from the Installed apps group, the
          Installed apps count drops to 4, and a success toast confirms
          Stock Daily was uninstalled with its data preserved. The other
          four fixture apps remain listed.

  - name: APPS-06 App details page renders manage rows and capability cards
    tags: [apps, shard-2]
    steps:
      - app.open: { path: /app-details/issue-triage }
      - aiAssert: >-
          The details page for Issue Triage is shown. There is a "Back to
          apps" link, the app name "Issue Triage" with version "0.2.2", an
          "Enabled" switch in the manage section, and "Uninstall" /
          "Uninstall and erase data" management rows.
      - aiAssert: >-
          Capability cards are shown with count pills; cards declaring
          nothing display the "No … declared." empty text appropriate to the
          capability. A README card is not shown because the mock has no
          readme.

  - name: APPS-07 Installing an unknown store handle shows the not-found state
    tags: [apps, shard-2]
    steps:
      # Store listings are intentionally not part of the mock, so the install
      # confirmation page lands in its error state instead of installing.
      - app.open: { path: /install-app/demo-handle/not-a-real-app, waitUntil: any }
      - wait: { duration: 1500 }
      - aiAssert: >-
          The install confirmation page shows an error stating the app was
          not found in the store ("App not found in the store") with a
          "Retry" button and a "Cancel" button. No install button is offered.
