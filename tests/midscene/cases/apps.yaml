cases:
  - name: APPS-01 Search the installed-app catalog
    tags:
      - apps
      - shard-2
    steps:
      - app.open:
          path: /apps
      - aiAct: >-
          Search for "issue" using the "Search apps" field and finish when the filtered result is
          visible.
      - aiAssert: >-
          The grid shows "1 result" and only the "Issue Triage" app is listed; the other installed
          apps ("Code Review", "Stock Daily", etc.) are not shown.
  - name: APPS-02 Disable an app from its tile menu
    tags:
      - apps
      - shard-2
    steps:
      - app.open:
          path: /apps
      - aiAct: >-
          On the Issue Triage card, open its actions menu and choose "Disable". Then reopen that
          card's actions menu. Finish with the menu open in the disabled state, showing "Enable"
          instead of "Disable".
      - aiAssert: >-
          The open actions menu belongs to Issue Triage and offers "Enable", confirming that Issue
          Triage is disabled.
  - name: APPS-03 Inspect the Issue Triage app details and capabilities
    tags:
      - apps
      - shard-2
    steps:
      - app.open:
          path: /app-details/issue-triage
      - aiAct: >-
          1. Explore the Issue Triage details page by reviewing its management actions and scrolling
          through its capability cards, without changing the app.
      - aiAssert: >-
          The details page for Issue Triage is shown. There is a "Back to apps" link, the app name
          "Issue Triage" with version "0.2.2", an "Enabled" switch in the manage section, and
          "Uninstall" / "Uninstall and erase data" management rows. Capability cards are shown with
          count pills; cards declaring nothing display the "No … declared." empty text appropriate
          to the capability. A README card is not shown because the mock has no readme.
