cases:
  - name: CHAT-01 Draft and clear a message from the home composer
    tags:
      - chat
      - shard-1
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          On the Chat home, type "draft" in the bottom message composer and then delete it without
          sending. Keep the current project and reasoning settings unchanged, and finish on the
          Chat home with the composer empty.
      - aiAssert: >-
          The chat home shows the greeting "Welcome," and the headline "What should we create?". The
          message composer shows the placeholder "How can I help you today?", the current project
          name "default", and a reasoning effort control that currently reads "Think". A button
          with an attachment icon is visible, along with the project picker, reasoning control, and
          arrow-shaped send button. The temporary "draft" text has been cleared and no message was
          sent.
  - name: CHAT-02 Exercise composer pickers and the failed-send state
    tags:
      - chat
      - shard-1
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          1. Find the field identified by "How can I help you today?", enter text with "Book a focus
          block tomorrow morning".

          2. Find the visible control labelled "Send" and click it.
      - aiAssert: >-
          The message is not sent: an error above the composer reports the failed request to
          "/api/chat/sessions" (the standalone mock has no chat backend, so the dev proxy fails).
          The typed text remains in the composer and the URL stays on /chat (no new conversation is
          created).
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find the field identified by "How can I help you today?", enter text with "/".
      - aiAssert: >-
          Typing "/" surfaces the skill picker failure state: an error notice reads "Failed to load
          skills." and no skill entries are listed.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find the field identified by "How can I help you today?", enter text with "@".

          4. Before continuing, confirm these visible checkpoints: An agent mention picker titled
          "Pick an agent to chat with" opens, showing a "Built-in agents" section with a "Rome"
          group and its two agents, "main" and "envoy".
      - aiAssert: >-
          An agent mention picker titled "Pick an agent to chat with" opens, showing a "Built-in
          agents" section with a "Rome" group and its two agents, "main" and "envoy".
  - name: CHAT-03 Preserve a draft after a failed send in an existing conversation
    tags:
      - chat
      - shard-1
    steps:
      - app.open:
          path: /chat/mock-chat-2
      - aiAct: >-
          In the open "Draft launch email" conversation, enter "Make the subject line shorter" in
          the bottom message composer, then use the arrow-shaped Send button immediately beside
          that same composer. Do not use the Send button inside the earlier question card. Finish
          after the failed-request error appears above the bottom composer.
      - aiAssert: >-
          Sending fails with an error above the composer: a proxy error message naming
          "/api/chat/sessions/mock-chat-2/turns" (the standalone mock has no chat backend). The
          typed draft "Make the subject line shorter" is still in the composer and no new user
          message bubble appears in the transcript.
  - name: CHAT-04 Inspect successful, failed, and delegated execution traces
    tags:
      - chat
      - shard-1
    steps:
      - app.open:
          path: /chat/mock-chat-1
      - aiAct: >-
          1. Explore the page by scrolling until the content containing "1 app · 1 step · 8.4s" is
          visible.

          2. Find and click the collapsed trace summary reading "1 app · 1 step · 8.4s".

          3. Before continuing, confirm these visible checkpoints: A collapsed trace summary under
          an assistant turn reads "1 app · 1 step · 8.4s".
      - aiAssert: >-
          A "Trace" drawer opens. Its header reads "Used 1 app · 1 step · 8.4s"; the step list names
          the "briefer" app session and shows a successful "settings_get" tool step with the detail
          "keys: [2]" and a per-step duration. There is no error styling on this step.
      - aiAct: >-
          1. Open the “Weekly planning” conversation from the Chats sidebar.

          2. Explore the page by scrolling until the content containing "The model provider is
          unavailable" is visible.

          3. Find and click the failed trace with the "model provider is unavailable" error.

          4. Before continuing, confirm these visible checkpoints: The failed assistant turn shows
          an inline error reading "Error: The model provider is unavailable — the run stopped here."
      - aiAssert: >-
          The trace drawer shows the failed step "Fetching it from the vendor portal." followed by a
          provider error card stating "Claude usage limit reached" with guidance to check usage or
          pick another model, and an "Open AI Tools" action.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Explore the page by scrolling until the content containing "researcher" is visible.

          3. Find the visible control labelled "Open trace for researcher" and click it.

          4. Before continuing, confirm these visible checkpoints: Near the routine proposal there
          is a delegated-subagents chip for the "researcher" subagent marked "completed" (its
          control is labelled "Open trace for researcher").
      - aiAssert: >-
          The trace panel explains the trace is not available yet, showing "Trace not available yet"
          with a "Retry" action.
  - name: CHAT-05 Give feedback and copy assistant messages
    tags:
      - chat
      - shard-1
    steps:
      - app.open:
          path: /chat/mock-chat-2
      - aiAct: >-
          1. Explore the page by scrolling until the content containing "Lead with the reader, not
          the feature." is visible.

          2. Find and click the "Mark this turn helpful" control on that assistant turn.

          3. Find and click Submit.

          4. Before continuing, confirm these visible checkpoints: A feedback popover opens with an
          optional comment field with the placeholder "Optional: what went wrong, or what was
          great?" and a "Submit" button.
      - aiAssert: >-
          The feedback popover is closed and the thumbs-up icon for that assistant turn remains
          filled or highlighted, showing that the helpful rating was recorded.
      - aiAct: >-
          1. Open the “Morning brief tweaks” conversation from the Chats sidebar.

          2. Explore the page by scrolling until the content containing "Kept. Tomorrow" is visible.

          3. Click the "Copy message" control on the assistant turn containing "Kept. Tomorrow",
          confirm that its copy icon briefly changes to a checkmark, then finish.
      - aiAssert: >-
          The assistant turn containing "Kept. Tomorrow" is visible with its message action controls.
