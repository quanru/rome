cases:
  - name: SHELL-01 Navigate every built-in surface from Chat to Settings
    tags:
      - shell
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          Visit each built-in surface from the left sidebar in this order: Apps, Projects, Sessions,
          Memory, People, Routines, Activity, Browser, and Settings. Confirm each destination loads
          before continuing. The Browser workspace may be blank in mock mode. Finish on Settings.
      - app.expectUrl:
          path: /settings
      - aiAssert: >-
          The Settings page is open after the full sidebar tour. Its settings navigation and
          Appearance content are visible, and the left application sidebar remains available.
  - name: SHELL-02 Search chats, toggle the sidebar, and edit pinned entries
    tags:
      - shell
      - shard-6
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          1. Use the "mod+k" keyboard command in the current interface.

          2. Use the "Escape" keyboard command in the current interface.

          3. Use the "mod+k" keyboard command in the current interface.

          4. Find the field identified by "Search chats and messages", enter text with "plumber".

          5. Find and click the "Plumber for the leak" search result.

          6. Before continuing, confirm these visible checkpoints: A search dialog opens over the
          page with the placeholder "Search chats and messages" and a "Recent chats" heading.
          Keyboard hints (Navigate / Open / Close) are shown at the bottom. The search dialog is
          closed and the chat home is interactive again. Results include the conversation "Plumber
          for the leak".
      - app.expectUrl:
          path: /chat/mock-chat-4
      - aiAssert: Results include the conversation "Plumber for the leak".
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Use the "mod+b" keyboard command in the current interface.

          3. Use the "mod+b" keyboard command in the current interface.

          4. Before continuing, confirm these visible checkpoints: The left sidebar is expanded,
          showing text labels next to the navigation icons, including "Chat" and "Apps". The sidebar
          collapses to a narrow icon rail: the Chat and Apps icons remain visible but their text
          labels are hidden.
      - aiAssert: The sidebar is expanded again with the "Chat" and "Apps" text labels visible.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find and click the "More actions" menu in the sidebar header.

          3. Find and click Edit.

          4. Activate the "Remove" control on the "Memory" pinned row.

          5. Find and click Done.

          6. Find and click the "More actions" menu in the sidebar header.

          7. Find and click Edit.

          8. In the "Add" section, activate the "Add" control for "Memory".

          9. Find and click Done.

          10. Before continuing, confirm these visible checkpoints: The expanded sidebar shows the
          "Memory" navigation entry. The sidebar enters edit mode: a "Done" button is visible,
          pinned rows show "Remove" controls, and an "Add" section lists entries not currently
          pinned. After exiting edit mode, the "Memory" entry is no longer shown in the main sidebar
          navigation, while required entries Chat and Apps remain.
      - aiAssert: The "Memory" entry is pinned and visible in the sidebar again.
  - name: SHELL-03 Use the mobile navigation drawer
    tags:
      - shell
      - mobile
      - shard-6
    steps:
      - app.open:
          path: /chat
          viewport: mobile
      - aiAct: >-
          1. Find and click Open sidebar.

          2. Find and click the Activity entry inside the open drawer.

          3. Before continuing, confirm these visible checkpoints: On the narrow layout, the sidebar
          is hidden by default and a sticky top bar shows an "Open sidebar" hamburger button. A
          navigation drawer slides over the page showing the Chat, Apps, and Activity entries, with
          a "Close sidebar" control and a dimmed backdrop.
      - app.expectUrl:
          path: /activity
      - aiAssert: >-
          The Activity page now fills the narrow viewport, and the navigation drawer is closed: no
          drawer panel or dimmed backdrop is visible, only the Activity content with the sticky top
          bar and its hamburger button.
  - name: SHELL-04 Inspect account actions, handle logout failure, and switch language
    tags:
      - shell
      - global
      - zh
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAct: 1. Find and click the "Account" button at the bottom of the sidebar.
      - aiAssert: >-
          The account menu opens showing "Rome Demo" with the "Guardian" role, followed by
          "Settings", "Feedback", and a red "Log out" action.
      - aiAct: >-
          1. Close transient menus and clear temporary searches, filters, or drafts before
          continuing, without undoing saved changes.

          2. Find and click the "Account" button at the bottom of the sidebar.

          3. Find and click the "Log out" menu item.
      - aiAssert: >-
          A top-right error toast reads "Couldn't log out. Please try again." and the user remains
          on the chat page (still signed in).
      - aiAct: >-
          1. Open Settings and select Appearance.

          2. Open the "Language" select and choose "中文".

          3. Find and click the 对话 entry in the left app navigation sidebar.

          4. Before continuing, confirm these visible checkpoints: Settings immediately localize:
          the page heading becomes "设置" and the Appearance section link in the settings navigation
          reads "外观".
      - app.expectUrl:
          path: /chat
      - aiAssert: >-
          The chat home is in Simplified Chinese: the greeting shows "欢迎", the headline is
          "我们从哪里开始?", and the composer placeholder reads "今天我能帮你做点什么?".
