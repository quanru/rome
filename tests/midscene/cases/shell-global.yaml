cases:
  - name: SHELL-01 Sidebar entries navigate between every built-in page
    tags:
      - shell
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAct: Find and click the Apps entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /apps
      - aiAct: Find and click the Projects entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /projects
      - aiAct: Find and click the Sessions entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /sessions
      - aiAct: Find and click the Memory entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /memory
      - aiAct: Find and click the People entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /people
      - aiAct: Find and click the Routines entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /routines
      - aiAct: Find and click the Activity entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /activity
      - aiAct: Find and click the Browser entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /desktop
      - wait:
          duration: 1000
      - aiAssert: >-
          The Browser/desktop workspace takes over the main area as an embedded remote-desktop frame
          that is blank in mock mode (no VNC backend is running); no chat content is shown.
      - aiAct: Find and click the Settings entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /settings
  - name: SHELL-02 Cmd+K opens chat search and finds a conversation
    tags:
      - shell
      - shard-6
    steps:
      - app.open:
          path: /chat
      - aiAct: Use the "mod+k" keyboard command in the current interface.
      - wait:
          duration: 700
      - aiAssert: >-
          A search dialog opens over the page with the placeholder "Search chats and messages" and a
          "Recent chats" heading. Keyboard hints (Navigate / Open / Close) are shown at the bottom.
      - aiAct: Use the "Escape" keyboard command in the current interface.
      - wait:
          duration: 400
      - aiAssert: The search dialog is closed and the chat home is interactive again.
      - aiAct: Use the "mod+k" keyboard command in the current interface.
      - wait:
          duration: 500
      - aiAct: Find the field identified by "Search chats and messages", enter text with "plumber".
      - wait:
          duration: 1200
      - aiAssert: Results include the conversation "Plumber for the leak".
      - aiAct: Find and click the "Plumber for the leak" search result.
      - app.expectUrl:
          path: /chat/mock-chat-4
  - name: SHELL-03 Cmd+B collapses and expands the sidebar
    tags:
      - shell
      - shard-6
    steps:
      - app.open:
          path: /chat
      - aiAssert: >-
          The left sidebar is expanded, showing text labels next to the navigation icons, including
          "Chat" and "Apps".
      - aiAct: Use the "mod+b" keyboard command in the current interface.
      - wait:
          duration: 600
      - aiAssert: >-
          The sidebar collapses to a narrow icon rail: the Chat and Apps icons remain visible but
          their text labels are hidden.
      - aiAct: Use the "mod+b" keyboard command in the current interface.
      - wait:
          duration: 600
      - aiAssert: The sidebar is expanded again with the "Chat" and "Apps" text labels visible.
  - name: SHELL-04 Edit mode removes a pinned entry and Add restores it
    tags:
      - shell
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAssert: The expanded sidebar shows the "Memory" navigation entry.
      - aiAct: Find and click the "More actions" menu in the sidebar header.
      - wait:
          duration: 400
      - aiAct: Find and click Edit.
      - wait:
          duration: 500
      - aiAssert: >-
          The sidebar enters edit mode: a "Done" button is visible, pinned rows show "Remove"
          controls, and an "Add" section lists entries not currently pinned.
      - aiAct: Activate the "Remove" control on the "Memory" pinned row.
      - wait:
          duration: 500
      - aiAct: Find and click Done.
      - wait:
          duration: 500
      - aiAssert: >-
          After exiting edit mode, the "Memory" entry is no longer shown in the main sidebar
          navigation, while required entries Chat and Apps remain.
      - aiAct: Find and click the "More actions" menu in the sidebar header.
      - wait:
          duration: 400
      - aiAct: Find and click Edit.
      - wait:
          duration: 400
      - aiAct: In the "Add" section, activate the "Add" control for "Memory".
      - wait:
          duration: 400
      - aiAct: Find and click Done.
      - wait:
          duration: 500
      - aiAssert: The "Memory" entry is pinned and visible in the sidebar again.
  - name: SHELL-05 Mobile viewport opens the sidebar as a closable drawer
    tags:
      - shell
      - mobile
      - shard-6
    steps:
      - app.open:
          path: /chat
          viewport: mobile
      - wait:
          duration: 800
      - aiAssert: >-
          On the narrow layout, the sidebar is hidden by default and a sticky top bar shows an "Open
          sidebar" hamburger button.
      - aiAct: Find and click Open sidebar.
      - wait:
          duration: 700
      - aiAssert: >-
          A navigation drawer slides over the page showing the Chat, Apps, and Activity entries,
          with a "Close sidebar" control and a dimmed backdrop.
      - aiAct: Find and click the Activity entry inside the open drawer.
      - app.expectUrl:
          path: /activity
      - wait:
          duration: 800
      - aiAssert: >-
          The Activity page now fills the narrow viewport, and the navigation drawer is closed: no
          drawer panel or dimmed backdrop is visible, only the Activity content with the sticky top
          bar and its hamburger button.
  - name: SHELL-06 Account menu shows identity and account actions
    tags:
      - shell
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAct: Find and click the "Account" button at the bottom of the sidebar.
      - wait:
          duration: 500
      - aiAssert: >-
          The account menu opens showing "Rome Demo" with the "Guardian" role, followed by
          "Settings", "Feedback", and a red "Log out" action.
  - name: SHELL-07 Log out is unsupported in mock mode and reports an error toast
    tags:
      - shell
      - shard-6
    steps:
      - app.open:
          path: /chat
      - aiAct: Find and click the "Account" button at the bottom of the sidebar.
      - wait:
          duration: 400
      - aiAct: Find and click the "Log out" menu item.
      - wait:
          duration: 1200
      - aiAssert: >-
          A top-right error toast reads "Couldn't log out. Please try again." and the user remains
          on the chat page (still signed in).
  - name: GLOBAL-01 Unknown routes redirect to the chat home
    tags:
      - global
      - shard-6
    steps:
      - app.open:
          path: /this/route/does/not/exist
          waitUntil: any
      - wait:
          duration: 1200
      - aiAct: >-
          Use the Chat entry in the sidebar to confirm the redirected shell remains navigable and
          leave the application on the chat home.
      - app.expectUrl:
          path: /chat
      - aiAssert: >-
          Rather than a 404 page, the unknown URL redirects into the authenticated chat home, which
          shows "What should we create?".
  - name: GLOBAL-02 Switching the language to Chinese localizes the whole shell
    tags:
      - global
      - zh
      - shard-6
    steps:
      - app.open:
          path: /settings/appearance
      - aiAct: Open the "Language" select and choose "中文".
      - wait:
          duration: 1000
      - aiAssert: >-
          Settings immediately localize: the page heading becomes "设置" and the Appearance section
          link in the settings navigation reads "外观".
      - aiAct: Find and click the 对话 entry in the left app navigation sidebar.
      - app.expectUrl:
          path: /chat
      - wait:
          duration: 1000
      - aiAssert: >-
          The chat home is in Simplified Chinese: the greeting shows "欢迎", the headline is
          "我们从哪里开始?", and the composer placeholder reads "今天我能帮你做点什么?".
