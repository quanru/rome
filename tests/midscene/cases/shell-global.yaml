cases:
  - name: SHELL-01 Collapse the application sidebar
    tags:
      - shell
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          Collapse the application sidebar using the Command+B keyboard shortcut once, then stop.
      - aiAssert: >-
          The sidebar is collapsed to a narrow icon rail: navigation icons remain visible while
          labels such as Chat and Apps are hidden.
  - name: SHELL-02 Open global chat search
    tags:
      - shell
      - shard-6
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          Open global chat search using the Command+K keyboard shortcut once, then stop.
      - aiAssert: >-
          A search dialog is open with the field "Search chats and messages", a "Recent chats"
          heading, and keyboard hints for navigating, opening, and closing results.
  - name: SHELL-03 Open the mobile navigation drawer
    tags:
      - shell
      - mobile
      - shard-6
    steps:
      - app.open:
          path: /chat
          viewport: mobile
      - aiAct: >-
          Click the visible "Open sidebar" hamburger button once, then stop.
      - aiAssert: >-
          A mobile navigation drawer is open over the page with Chat, Apps, and Activity entries, a
          "Close sidebar" control, and a dimmed backdrop.
  - name: SHELL-04 Open the account menu
    tags:
      - shell
      - global
      - zh
      - shard-5
    steps:
      - app.open:
          path: /chat
      - aiAct: 1. Find and click the "Account" button at the bottom of the sidebar.
      - aiAssert: >-
          The account menu opens showing "Rome Demo" with the "Guardian" role, followed by
          "Settings", "Feedback", and a red "Log out" action.
