cases:
  - name: AUTH-01 Mock guardian opens the app root and lands on the chat home
    tags: [poc, auth, shard-5]
    steps:
      - app.open: { path: / }
      - app.expectUrl: { path: /chat }
      - aiAssert: >-
          The chat home is shown in English. It shows the greeting
          "Welcome,", the headline "What should we create?", and the left
          app navigation is visible with the Chat and Apps entries.
      # The composer is pinned below a tall welcome scroll region and can
      # sit under the screenshot fold; assert its placeholder in the DOM.
      - app.expectDom:
          selector: "textarea"
          count: 1
          attribute: { name: "placeholder", value: "How can I help you today?" }

  - name: AUTH-02 Login preview renders the local sign-in form with validation
    tags: [auth, shard-5]
    steps:
      # /dev/login is a dev-only preview that fakes the needs-signin bootstrap
      # phase, rendering the real LoginPage without a backend.
      - app.open: { path: /dev/login, waitUntil: login }
      - aiAssert: >-
          The sign-in page is shown in English with the heading "Sign In" and
          the description "Use your guardian account to access Rome." It has
          "Username" and "Password" fields and a "Sign in" submit button. A
          language switcher is visible in the top-right corner.
      - aiTap: 'the "Sign in" button with both fields empty'
      - wait: { duration: 600 }
      - aiAssert: >-
          Inline validation messages "Username is required." and "Password is
          required." appear and no navigation happens.

  - name: AUTH-03 Submitting the login form against the mock shows a login failure
    tags: [auth, shard-5]
    steps:
      # POST /api/auth/login is intentionally not mocked; the form surfaces
      # its generic error fallback ("Login failed") rather than navigating.
      - app.open: { path: /dev/login, waitUntil: login }
      - app.typeText: { target: "Username", text: "guardian" }
      - app.typeText: { target: "Password", text: "demo-password" }
      - aiTap: 'the "Sign in" button'
      - wait: { duration: 1500 }
      - aiAssert: >-
          The page stays on the sign-in form and shows a red error saying
          "Login failed". The filled username is still present so it can be
          retried.

