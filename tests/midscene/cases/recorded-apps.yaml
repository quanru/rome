cases:
  - name: RAPP-01 Inspect the Issue Triage dashboard and recent results
    tags:
      - apps
      - shard-6
    steps:
      - app.open:
          path: /apps/issue-triage
      - aiAct: >-
          1. Explore the Recent triage activity section, scrolling as needed to inspect the three
          results and issue #363, then return to the dashboard summary.
      - aiAssert: >-
          The Issue Triage recorded app renders inside its embedded view with the heading "Issue
          Triage" and the subtitle "AI auto-labeling for GitHub issues · 1 repo · 3 triaged". Stat
          counters read "Repos 1", "Triaged 3", "Succeeded 3", and "Failed 0". A "Recent triage
          activity" section lists three succeeded results for "rome-os/rome", including issue "#
          363" titled "opencli: support browser extensions in managed sessions" with the
          "feature-request" label and a "P2" priority badge.
  - name: RAPP-02 Review a recorded code review from timeline to findings
    tags:
      - apps
      - shard-6
    steps:
      - app.open:
          path: /apps/code-review
      - aiAct: >-
          1. Find and click the "PR #301" review item.

          2. Explore the page by scrolling until the content containing "Verdict" is visible.

          3. Explore the page by scrolling until the content containing "[P2]" is visible.

          4. Before continuing, confirm these visible checkpoints: The Code Review recorded app
          dashboard shows "1 repo · 2 reviews" for "rome-os/rome" and an Activity list with two
          completed reviews: "PR #301 fix(app-web-sdk): resolve app renderer from the SDK" and "PR
          #300 chore(apps): drop unused runtime dependencies", each marked "Completed". The review
          detail renders with a "Back" control, the heading "#301 fix(app-web-sdk): resolve app
          renderer from the SDK", and a "completed" state attributed to "zhangfand". A review
          timeline shows the queued/cloning/reviewing/posting stages. Below the timeline, a
          "Verdict" section reads "REQUEST_CHANGES" followed by a "Findings (3)" heading.
      - aiAssert: >-
          The findings list continues below P1 with a "[P2]" finding and a "[P3]" finding, each with
          a source file reference, so all three ranked findings are present.
  - name: RAPP-03 Inspect a Stock Daily report from schedule to market news
    tags:
      - apps
      - shard-6
    steps:
      - app.open:
          path: /apps/stock-daily
      - aiAct: >-
          1. Find and click the "2026-09-11" report row.

          2. Explore the page by scrolling until the content containing "4. Sector Performance" is
          visible.

          3. Explore the page by scrolling until the content containing "8. Key Stock News and
          Notable Moves" is visible.

          4. Before continuing, confirm these visible checkpoints: The Stock Daily recorded app
          header shows "2 reports" with "Frequency Weekdays" and a next-run time of "09/16, 04:30
          AM". The Report History lists two scheduled, completed reports dated "2026-09-11" and
          "2026-09-10", each with a preview of its data cutoff note. The report view renders with a
          "Back to list" control and the title "US Stock Market Daily Close Report | 2026-09-11",
          marked "Completed". The report body opens with the data cutoff note and the "1. Major
          Index Overview" section (an executive summary may appear above the numbered sections). The
          report body contains the "4. Sector Performance" section.
      - aiAssert: >-
          Further down, the "8. Key Stock News and Notable Moves" section is rendered with news
          entries, confirming the full recorded report is browsable rather than an error state.
